<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Галерея спрайтов</title>
<style>body{background:#2a3a2a;color:#eee;font:12px monospace;margin:8px} .it{display:inline-block;margin:4px;text-align:center;vertical-align:bottom} canvas{image-rendering:pixelated;display:block}</style>
</head><body>
<div id="out"></div>
<script type="module">
import { REG, buildingSprite } from '../js/gfx/buildings.js';
import '../js/gfx/allBuildings.js';
const out = document.getElementById('out');
const params = new URLSearchParams(location.search);
const only = params.get('only');
const scale = +(params.get('scale') || 2);
const night = params.has('night');
const t0 = performance.now();
for (const id of Object.keys(REG)) {
  if (only && !id.startsWith(only)) continue;
  for (const v of (params.has('all') ? [0,1,2,3] : [0,1])) {
    try {
      const s = buildingSprite(id, v);
      const cv = night ? s.night : s.day;
      const c = document.createElement('canvas');
      c.width = cv.width * scale; c.height = cv.height * scale;
      const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(cv, 0, 0, c.width, c.height);
      const d = document.createElement('div'); d.className = 'it'; d.appendChild(c); d.append(id + ':' + v); out.appendChild(d);
    } catch (e) { out.append('ERR ' + id + ' ' + e.message + ' '); console.error(e); }
  }
}
console.log('generated in', Math.round(performance.now() - t0), 'ms');
</script></body></html>
