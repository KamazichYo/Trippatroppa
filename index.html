<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trippatroppa — градостроитель 90-х</title>
<meta name="description" content="Пиксельный градостроитель в сеттинге 90-х: от деревни до мегаполиса.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%232a3a5a'/><rect x='3' y='5' width='4' height='9' fill='%23e0d0b0'/><rect x='8' y='2' width='5' height='12' fill='%23c8c8c8'/><rect x='9' y='4' width='1' height='1' fill='%23ffd060'/><rect x='11' y='7' width='1' height='1' fill='%23ffd060'/></svg>">
</head>
<body>
<canvas id="view"></canvas>

<div id="loading"><div class="ld-box"><div class="ld-title">TRIPPATROPPA</div><div class="ld-sub">градостроитель 90-х</div><div class="ld-bar"><div id="ld-fill"></div></div><div id="ld-text">Загрузка…</div></div></div>

<header id="top">
  <div class="tb-group city">
    <div id="cityName" class="city-name" title="Переименовать">Город</div>
    <div id="rankName" class="rank">Деревня</div>
  </div>
  <div class="tb-group stats">
    <div class="stat" title="Казна"><span class="ico">₽</span><span id="money">0</span><span id="moneyDelta" class="delta"></span></div>
    <div class="stat" title="Население"><span class="ico">👥</span><span id="pop">0</span></div>
    <div class="stat" title="Счастье жителей"><span class="ico" id="moodIco">🙂</span><span id="happy">0%</span></div>
    <div class="stat" title="Безработица"><span class="ico">🏭</span><span id="unemp">0%</span></div>
  </div>
  <div class="tb-group time">
    <div id="date" class="date">Январь 1990, 08:00</div>
    <div class="speeds">
      <button data-speed="0" title="Пауза (Пробел)">❚❚</button>
      <button data-speed="1" title="Скорость 1 (1)">▶</button>
      <button data-speed="2" title="Скорость 2 (2)">▶▶</button>
      <button data-speed="3" title="Скорость 3 (3)">▶▶▶</button>
    </div>
  </div>
  <div class="tb-group demand" title="Спрос: жильё, коммерция, промышленность, сельхоз">
    <div class="dbar" data-z="R"><div class="fill"></div><span>Ж</span></div>
    <div class="dbar" data-z="C"><div class="fill"></div><span>К</span></div>
    <div class="dbar" data-z="I"><div class="fill"></div><span>П</span></div>
    <div class="dbar" data-z="A"><div class="fill"></div><span>С</span></div>
  </div>
  <div class="tb-group menu">
    <button data-panel="budget" title="Бюджет">💰</button>
    <button data-panel="stats" title="Статистика">📈</button>
    <button data-panel="resources" title="Ресурсы и сети">⚡</button>
    <button data-panel="people" title="Жители">👤</button>
    <button data-panel="news" title="Новости">📰</button>
    <button data-panel="layers" title="Информационные слои">🗺</button>
    <button data-panel="god" class="god-btn" title="Меню бога (G)">✨</button>
    <button data-panel="game" title="Игра: сохранение, новый город">☰</button>
  </div>
</header>

<nav id="tools"></nav>
<div id="tray" class="hidden"></div>

<aside id="info" class="hidden"></aside>
<div id="panel" class="hidden"><div class="panel-head"><span id="panelTitle"></span><button id="panelClose">✕</button></div><div id="panelBody"></div></div>

<div id="ticker"><div id="tickerText"></div></div>
<canvas id="minimap" width="160" height="160" title="Мини-карта"></canvas>
<div id="tooltip" class="hidden"></div>
<div id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
